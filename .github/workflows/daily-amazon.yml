name: Daily Amazon Catalog

# 每天抓 Amazon 多市场五品牌电视清单+价(catalog-driven Option C)。
# DE: 已验证固定 canary；GB: 邮编 CV4 7ES，先用地址成功 + GBP 搜索价守门。
# 各市场分 job 跑并保存成功结果；任一国家失败必须使整轮失败，不能借用同日旧目录。
on:
  schedule:
    - cron: "0 4 * * *"   # 每天 04:00 UTC(GitHub 实际迟到 2-6h → 约 06-10 UTC,赶在私库 enrich 12 UTC 前)
  workflow_dispatch:
    inputs:
      amazon_max_pages:
        description: "Amazon 每品牌翻页数(默认 15)"
        required: false
        default: "15"

# 同一时刻只跑一个,防与上一轮/并发抢提交
concurrency:
  group: daily-amazon-catalog
  queue: max
  cancel-in-progress: false

jobs:
  scrape:
    name: Scrape ${{ matrix.market }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - market: amazon_de
            country: de
          - market: amazon_gb
            country: gb
          - market: amazon_it
            country: it
          - market: amazon_es
            country: es
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Install Playwright Chromium
        run: python -m playwright install chromium --with-deps

      - name: Run scraper safety tests
        # 测试制造的故障必须与随后真实抓取的现场分开，避免混入国家诊断附件。
        env:
          FAILURE_EVIDENCE_DIR: ${{ runner.temp }}/scraper-tests-${{ matrix.country }}/failures
          PRICE_ARTIFACTS_DIR: ${{ runner.temp }}/scraper-tests-${{ matrix.country }}/price-changes
          CURRYS_CATALOG_DIAGNOSTICS_DIR: ${{ runner.temp }}/scraper-tests-${{ matrix.country }}/catalogs
        run: python -m pytest tests -q

      - name: Record current scrape identity
        run: python scripts/amazon_artifact_gate.py prepare --country ${{ matrix.country }} --context _amazon_run.json --catalog catalog

      - name: Scrape Amazon catalog（set address + canary + fail-closed)
        id: scrape
        working-directory: scripts
        env:
          HEADLESS_MODE: "true"
          AMAZON_MAX_PAGES: ${{ inputs.amazon_max_pages || '15' }}
          AMAZON_TARGET_YEARS: "2025,2026"
          AMAZON_YEAR_MAX_PAGES: "1"
          AMAZON_MAX_SERIES_RESCUE_QUERIES: "25"
          AMAZON_MAX_VARIANT_SEEDS: "40"
          AMAZON_MAX_VARIANTS_PER_SEED: "10"
          AMAZON_SESSION_PREP_ATTEMPTS: "3"
          AMAZON_PREVIOUS_CATALOG_LOOKBACK: "7"
          AMAZON_MAX_PREVIOUS_RECOVERY_ITEMS: "40"
          AMAZON_MIN_CATALOG_ROWS: "100"
          AMAZON_MIN_PREVIOUS_RATIO: "0.70"
        run: python -m catalog_scrape.run_weekly --only ${{ matrix.market }}

      - name: Upload Amazon diagnostic candidates（无论成功或失败，均与正式目录隔离）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: amazon-diagnostics-${{ matrix.country }}
          path: scripts/catalog_artifacts/amazon_${{ matrix.country }}/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload failure evidence（关闭页面前采集的脱敏现场）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: failure-amazon-${{ matrix.country }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: scripts/failure_artifacts/
          if-no-files-found: ignore
          retention-days: 14

      - name: Stage current result（失败只交接状态，不上传 checkout 的旧目录）
        if: always()
        run: >-
          python scripts/amazon_artifact_gate.py stage
          --context _amazon_run.json --catalog catalog
          --out _amazon_out/${{ matrix.country }}
          --outcome "${{ steps.scrape.outcome }}"

      - name: Summarize significant price changes
        if: always()
        run: python scripts/price_anomalies.py summary --output-dir scripts/price_artifacts --github-summary "$GITHUB_STEP_SUMMARY"

      - name: Upload Amazon price change snapshots（独立保留90天）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: price-changes-amazon-${{ matrix.country }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: scripts/price_artifacts/
          retention-days: 90
          if-no-files-found: ignore

      - name: Upload current result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: amazon-result-${{ matrix.country }}
          path: _amazon_out/${{ matrix.country }}/
          if-no-files-found: error

  commit:
    name: Commit Amazon catalogs
    runs-on: ubuntu-latest
    needs: scrape
    # 单个市场失败时，仍提交其他已成功市场的 artifact，避免一个站点阻断四国更新。
    # 失败状态也交接；独立 staging 防止 checkout 中已有同日文件被算作本轮产物。
    if: ${{ always() && !cancelled() }}
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 汇总 job 可能比抓取 job 晚几十分钟；按分支最新 HEAD 检出，
          # 避免并发人工修复后仍拿 workflow 启动时的旧基线做完整性判断。
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download current result artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: amazon-result-*
          path: _amazon_download
          merge-multiple: false

      - name: Validate current artifacts and import successful markets
        id: collect
        run: >-
          python scripts/amazon_artifact_gate.py collect
          --artifacts _amazon_download --catalog catalog --report _amazon_validation
          --scrape-result "${{ needs.scrape.result }}"

      - name: Commit catalog（清理旧份 + rebase 重试，防并发）
        # 分支全量验收只保存本轮产物，正式目录统一在 main 发布。
        if: github.ref == 'refs/heads/main'
        run: |
          set -e
          git config user.name "tvrend-scraper bot"
          git config user.email "actions@github.com"
          # 仅整理本轮成功国家；失败国家旧数据保持原样，但不计作成功。
          while IFS= read -r c; do
            ls catalog/amazon_${c}_*.csv 2>/dev/null | sort | head -n -14 | while read -r f; do
              git rm -f "$f" >/dev/null 2>&1 || rm -f "$f"
            done
          done < _amazon_validation/publish-countries.txt
          while IFS= read -r f; do
            git add -- "catalog/$f"
          done < _amazon_validation/publish-files.txt
          if git diff --cached --quiet; then
            echo "本轮无通过验收的数据变化，跳过提交；最终状态由独立门禁判定。"
          else
            git commit -m "chore: daily amazon catalog ${{ github.run_id }} [skip ci]"
            BR="$GITHUB_REF_NAME"
            pushed=false
            for i in 1 2 3 4 5; do
              if git pull --rebase origin "$BR" && git push origin "HEAD:$BR"; then
                pushed=true
                break
              fi
              git rebase --abort 2>/dev/null || true
              sleep $((i * 3))
            done
            if [ "$pushed" != "true" ]; then
              echo "::error::推送失败。"
              exit 1
            fi
          fi

      - name: Upload current market validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: amazon-validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: _amazon_validation/
          retention-days: 14
          if-no-files-found: warn

      - name: Require all four current markets to succeed
        if: ${{ always() && steps.collect.outcome == 'success' }}
        run: python scripts/amazon_artifact_gate.py gate --report _amazon_validation/report.json
