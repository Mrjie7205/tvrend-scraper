name: Daily Price Monitor - Currys

# 抓取按渠道独立运行，只交接本轮观测；共享主表由独立发布任务合并。
on:
  schedule:
    - cron: "45 5 * * *"
  workflow_dispatch:
    inputs:
      max_skus:
        description: "手动测试用：最多抓取 SKU 数；留空/0 表示全量"
        required: false
        default: "0"

concurrency:
  group: daily-price-currys-${{ github.ref }}
  queue: max
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: read
    env:
      MONITOR_INPUT_MAX_SKUS: ${{ inputs.max_skus || '0' }}
    steps:
      - name: Checkout scrape source
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -c "import importlib.metadata as m; print('Playwright', m.version('playwright'))"

      - name: Install Playwright Chromium
        run: python -m playwright install chromium --with-deps

      - name: Run Currys daily monitor
        id: scrape
        working-directory: scripts
        env:
          HEADLESS_MODE: "true"
          PYTHONUNBUFFERED: "1"
          MONITOR_CONCURRENCY: "3"
          MONITOR_SKU_TIMEOUT_SECONDS: "120"
          PLAYWRIGHT_CLOSE_TIMEOUT_SECONDS: "10"
          MONITOR_MAX_SKUS: ${{ env.MONITOR_INPUT_MAX_SKUS }}
          CHANNELS: "Currys"
          PRICE_PUBLICATION_DIR: ${{ github.workspace }}/scripts/monitor_artifacts/price-publication
        run: python -m monitor_prices.run_daily

      - name: Upload checkpoint and failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: monitor-currys-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            scripts/failure_artifacts/
            scripts/monitor_artifacts/
            scripts/debug_screenshots/
            scripts/catalog_artifacts/currys_gb/
          retention-days: 14
          if-no-files-found: warn

      - name: Upload current price publication artifact
        if: ${{ steps.scrape.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: price-currys-${{ github.run_id }}-${{ github.run_attempt }}
          path: scripts/monitor_artifacts/price-publication/
          retention-days: 14
          if-no-files-found: error

      - name: Summarize significant price changes
        if: always()
        run: python scripts/price_anomalies.py summary --output-dir scripts/price_artifacts --github-summary "$GITHUB_STEP_SUMMARY"

      - name: Upload price change snapshots（独立保留90天）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: price-changes-currys-${{ github.run_id }}-${{ github.run_attempt }}
          path: scripts/price_artifacts/
          retention-days: 90
          if-no-files-found: ignore

  publish:
    name: Merge current prices into latest main
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: monitor
    # 手动分支和有限 SKU 烟测只留下产物，不能更新正式价格。
    if: ${{ needs.monitor.result == 'success' && github.ref == 'refs/heads/main' && (inputs.max_skus || '0') == '0' }}
    concurrency:
      group: raw-prices-${{ github.ref }}
      queue: max
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - name: Checkout latest target branch while holding publication lock
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download this run price artifact
        uses: actions/download-artifact@v4
        with:
          name: price-currys-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/price-publication-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Validate merge publish and read back prices
        env:
          PRICE_ARTIFACT_DIR: ${{ runner.temp }}/price-publication-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          python scripts/price_publication.py publish \
            --artifact-dir "$PRICE_ARTIFACT_DIR" \
            --repo-dir "$GITHUB_WORKSPACE" \
            --repository "$GITHUB_REPOSITORY" \
            --expected-run-id "$GITHUB_RUN_ID" \
            --expected-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --expected-source-sha "$GITHUB_SHA" \
            --expected-source-ref "$GITHUB_REF" \
            --expected-channel Currys \
            --branch main
